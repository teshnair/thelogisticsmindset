[build]
  # Weekly releases stay Sunday-only. This exact dated marker authorizes the
  # owner's requested October 1 UTC release; the regulatory gate still runs.
  ignore = "node scripts/netlify-ignore.cjs"
  command = "node scripts/verify-regulatory-release-gate.mjs && node scripts/test-regulatory-release.mjs && node scripts/test-hts-shipment.mjs"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/api/trade-rules"
  to = "/.netlify/functions/trade-rules"
  status = 200
  force = true
