[build]
  command = "node scripts/apply-seo.mjs"

  # Production deploys are allowed only for explicit Sunday release commits.
  # Non-production deploys are intentionally skipped while SEO changes are staged.
  ignore = "if [ \"$CONTEXT\" != \"production\" ]; then exit 0; fi; day=$(date -u +%u); msg=$(git log -1 --pretty=%B \"$COMMIT_REF\"); if [ \"$day\" = \"7\" ] && printf '%s' \"$msg\" | grep -q '\\[deploy\\]'; then exit 1; else exit 0; fi"
