name: Apply dynamic known-field filter

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - .github/workflows/apply-dynamic-known-fields.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-import-calculator
          fetch-depth: 0
      - name: Apply dynamic question fix
        run: python scripts/patch-dynamic-known-fields.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/hts-import-screening-v2.js
          git commit -m 'Do not repeat main-form facts in HTS questions'
          git push origin HEAD:preview-import-calculator
