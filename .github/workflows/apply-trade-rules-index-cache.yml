name: Apply Chapter 99 index cache validation patch

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - .github/workflows/apply-trade-rules-index-cache.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-import-calculator
          fetch-depth: 0
      - name: Patch resolver cache
        run: python scripts/patch-trade-rules-index-cache.py
      - name: Commit cache fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/trade-rules.mts
          git commit -m 'Refresh Chapter 99 index cache by deploy artifact'
          git push origin HEAD:preview-import-calculator
