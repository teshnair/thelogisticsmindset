name: Apply targeted Chapter 99 result cleanup

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - .github/workflows/fix-ch99-result-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-import-calculator
          fetch-depth: 0

      - name: Patch finished-vehicle screening and legacy warning cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path('netlify/functions/trade-rules.mts')
          text = backend.read_text()
          old = 'function conditionDecision(ref:string,meta:IndexHeading|undefined,input:any,hts:string,country:string){const required=new Set<string>(),context=headingContext(meta),targets=meta?.noteTargets||[],chapter=Number(hts.slice(0,2));'
          new = 'function conditionDecision(ref:string,meta:IndexHeading|undefined,input:any,hts:string,country:string){const required=new Set<string>(),context=headingContext(meta),rowText=clean(meta?.text),targets=meta?.noteTargets||[],chapter=Number(hts.slice(0,2));if(hts.startsWith("8703")&&/\\b(?:vehicle|automobile)\\s+parts\\b/i.test(rowText))return{state:"not-applicable" as const,reason:"HTS 8703 is a passenger-vehicle classification, not a vehicle-parts classification.",requiredFacts:[]};'
          if old not in text:
              raise SystemExit('conditionDecision start pattern not found')
          backend.write_text(text.replace(old, new, 1))

          frontend = Path('js/hts-import-screening-v2.js')
          text = frontend.read_text()
          marker = '''  function addMeasureCard(measure) {'''
          helper = '''  function removeLegacyTradeMeasureNotice() {\n    const review = document.getElementById("additionalReview");\n    if (!review) return;\n    review.querySelectorAll(".notice").forEach(el => {\n      const text = (el.textContent || "").toLowerCase();\n      if (text.includes("no additional trade-measure rate could be resolved automatically") || text.includes("no additional chapter 99 trade measure was identified by the current rule set")) el.remove();\n    });\n  }\n\n'''
          if marker not in text:
              raise SystemExit('frontend addMeasureCard marker not found')
          text = text.replace(marker, helper + marker, 1)
          old = '''      lastRulePreview = ruleData;\n      renderQuestions(ruleData);\n\n      removeLegacyProgramCards("Section 232");'''
          new = '''      lastRulePreview = ruleData;\n      renderQuestions(ruleData);\n      if (ruleData?.revisionVerified === true && !["source-unavailable", "source-stale"].includes(ruleData?.status)) removeLegacyTradeMeasureNotice();\n\n      removeLegacyProgramCards("Section 232");'''
          if old not in text:
              raise SystemExit('frontend resolveAndRender marker not found')
          frontend.write_text(text.replace(old, new, 1))
          PY

      - name: Commit targeted fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/trade-rules.mts js/hts-import-screening-v2.js
          git commit -m 'Clean up Chapter 99 vehicle and legacy results'
          git push origin HEAD:preview-import-calculator
