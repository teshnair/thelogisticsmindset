name: HTS calculator regulatory smoke test

on:
  push:
    branches:
      - preview-import-calculator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regulatory-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for deploy preview and test Chapter 99 resolver
        env:
          BASE_URL: https://deploy-preview-43--thelogisticsmindset.netlify.app
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          base = os.environ['BASE_URL']

          def request(path, retries=20):
              url = base + path
              last = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'TheLogisticsMindset-SmokeTest/3.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req, timeout=35) as res:
                          body = res.read().decode('utf-8')
                          if res.status == 200:
                              return json.loads(body)
                          last = RuntimeError(f'HTTP {res.status}: {body[:500]}')
                  except Exception as exc:
                      last = exc
                  time.sleep(8)
              raise last or RuntimeError('request failed')

          def post_json(path, payload, retries=20):
              last = None
              for attempt in range(retries):
                  try:
                      body = json.dumps(payload).encode('utf-8')
                      req = urllib.request.Request(base + path, data=body, method='POST', headers={'User-Agent':'TheLogisticsMindset-SmokeTest/3.0','Cache-Control':'no-cache','Content-Type':'application/json'})
                      with urllib.request.urlopen(req, timeout=35) as res:
                          data = json.loads(res.read().decode('utf-8'))
                          if res.status == 200:
                              return data
                          last = RuntimeError(f'HTTP {res.status}: {str(data)[:500]}')
                  except Exception as exc:
                      last = exc
                  time.sleep(8)
              raise last or RuntimeError('POST request failed')

          def lookup(hts, country, value=10000, **facts):
              params = {'hts':hts,'country':country,'customsValue':value,'_smoke':time.time_ns()}
              params.update(facts)
              q = urllib.parse.urlencode(params)
              data = request('/api/trade-rules?' + q)
              print('\nCASE', hts, country, facts)
              print(json.dumps(data, indent=2)[:24000])
              return data

          def measure(data, ref):
              return next((m for m in data.get('measures',[]) if m.get('hts') == ref), None)

          def assert_current(data):
              assert data.get('revisionVerified') is True, data
              assert (data.get('currentHts') or {}).get('revision') == 18, data
              assert (data.get('indexHts') or {}).get('revision') == 18, data

          def quick_amount(m):
              return m.get('estimatedDuty') if m.get('estimatedDuty') is not None else m.get('worstCaseEstimatedDuty')

          def assert_metal_mutual_exclusivity(data):
              candidates = []
              for m in data.get('measures', []):
                  ref = str(m.get('hts',''))
                  if not ref.startswith('9903.82.'):
                      continue
                  try:
                      suffix = int(ref.rsplit('.',1)[1])
                  except Exception:
                      continue
                  if 2 <= suffix <= 26:
                      candidates.append(m)
              applied = [m for m in candidates if m.get('applicability') == 'applicable']
              assert len(applied) <= 1, candidates
              if len(candidates) > 1:
                  assert all(m.get('applicability') != 'applicable' for m in candidates), candidates
                  assert all('mutually exclusive' in str(m.get('reason','')).lower() for m in candidates), candidates

          broad = lookup('7321','RU')
          assert broad.get('needsFullHts') is True, broad
          assert broad.get('status') == 'needs-full-hts', broad

          unit_search = post_json('/api/hts-duty', {'action':'search','hts':'73211130'})
          suggestions = [s for s in unit_search.get('suggestions', []) if str(s.get('code','')).startswith('73211130')]
          assert suggestions, unit_search
          assert all(isinstance(s.get('units'), list) for s in suggestions), suggestions
          assert any(s.get('units') for s in suggestions), suggestions
          assert all('<sup' not in str(u).lower() for s in suggestions for u in s.get('units', [])), suggestions

          china_auto = lookup('8703230100','CN', vehicleManufactureYear=2024)
          assert_current(china_auto)
          assert_metal_mutual_exclusivity(china_auto)
          m301 = measure(china_auto, '9903.88.01')
          assert m301 and m301.get('program') == 'Section 301', china_auto
          assert m301.get('applicability') in ('applicable','needs-facts'), m301
          assert m301.get('ratePercent') == 25, m301
          assert quick_amount(m301) == 2500, m301
          assert not measure(china_auto, '9903.90.08'), china_auto
          auto232 = measure(china_auto, '9903.94.01')
          assert auto232 and auto232.get('program') == 'Section 232', china_auto
          assert auto232.get('applicability') == 'applicable', auto232
          assert auto232.get('ratePercent') == 25, auto232
          assert quick_amount(auto232) == 2500, auto232
          assert not measure(china_auto, '9903.94.04'), china_auto
          assert not measure(china_auto, '9903.94.05'), china_auto

          india_auto = lookup('8703230100','IN', vehicleManufactureYear=2024)
          assert_current(india_auto)
          assert_metal_mutual_exclusivity(india_auto)
          assert not measure(india_auto, '9903.88.01'), india_auto
          assert not measure(india_auto, '9903.90.08'), india_auto
          assert measure(india_auto, '9903.94.01'), india_auto
          assert not measure(india_auto, '9903.94.05'), india_auto

          old_china_auto = lookup('8703230100','CN', vehicleManufactureYear=1995)
          assert_current(old_china_auto)
          assert_metal_mutual_exclusivity(old_china_auto)
          old232 = measure(old_china_auto, '9903.94.04')
          assert old232 and old232.get('applicability') == 'applicable', old_china_auto
          assert old232.get('ratePercent') == 0, old232
          assert not measure(old_china_auto, '9903.94.01'), old_china_auto
          assert measure(old_china_auto, '9903.88.01'), old_china_auto

          ru_unknown = lookup('7321111000','RU')
          assert_current(ru_unknown)
          assert_metal_mutual_exclusivity(ru_unknown)
          ru_unknown_25 = measure(ru_unknown, '9903.82.16')
          assert ru_unknown_25 and ru_unknown_25.get('applicability') == 'applicable', ru_unknown
          assert ru_unknown_25.get('ratePercent') == 25, ru_unknown_25
          assert quick_amount(ru_unknown_25) == 2500, ru_unknown_25
          assert not ru_unknown.get('requiredFacts'), ru_unknown
          assert any('melt/pour' in str(a).lower() and 'origin' in str(a).lower() for a in ru_unknown.get('assumptions',[])), ru_unknown

          ru_default = lookup('7321111000','RU', usMetalContentQualification='false')
          assert_current(ru_default)
          assert_metal_mutual_exclusivity(ru_default)
          ru25 = measure(ru_default, '9903.82.16')
          assert ru25 and ru25.get('applicability') == 'applicable', ru_default
          assert ru25.get('ratePercent') == 25, ru25
          assert quick_amount(ru25) == 2500, ru25
          assert not measure(ru_default, '9903.82.15'), ru_default

          ru_reduced = lookup('7321111000','RU', usMetalContentQualification='true')
          assert_current(ru_reduced)
          assert_metal_mutual_exclusivity(ru_reduced)
          ru10 = measure(ru_reduced, '9903.82.15')
          assert ru10 and ru10.get('applicability') == 'applicable', ru_reduced
          assert ru10.get('ratePercent') == 10, ru10
          assert quick_amount(ru10) == 1000, ru10
          assert not measure(ru_reduced, '9903.82.16'), ru_reduced

          ca_steel = lookup('7321111000','CA', usMetalContentQualification='false')
          assert_current(ca_steel)
          assert_metal_mutual_exclusivity(ca_steel)
          assert not measure(ca_steel, '9903.82.15'), ca_steel
          assert not measure(ca_steel, '9903.82.16'), ca_steel
          all_other = measure(ca_steel, '9903.82.09')
          assert all_other, ca_steel
          assert all_other.get('applicability') in ('applicable','needs-facts'), all_other
          assert all_other.get('ratePercent') == 25, all_other
          assert quick_amount(all_other) == 2500, all_other
          if all_other.get('applicability') == 'needs-facts':
              assert 'ftaQualification' in ca_steel.get('requiredFacts',[]), ca_steel

          print('\nAll Chapter 99 and HTS-unit smoke tests passed.')
          PY