name: HTS calculator regulatory smoke test

on:
  push:
    branches:
      - preview-import-calculator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regulatory-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for deploy preview and test trade-rule resolver
        env:
          BASE_URL: https://deploy-preview-43--thelogisticsmindset.netlify.app
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          base = os.environ['BASE_URL']

          def request(path, retries=15):
              url = base + path
              last = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'TheLogisticsMindset-SmokeTest/1.0'})
                      with urllib.request.urlopen(req, timeout=30) as res:
                          body = res.read().decode('utf-8')
                          if res.status == 200:
                              return json.loads(body)
                          last = RuntimeError(f'HTTP {res.status}: {body[:500]}')
                  except Exception as exc:
                      last = exc
                  time.sleep(8)
              raise last or RuntimeError('request failed')

          def lookup(hts, country, value=10000):
              q = urllib.parse.urlencode({'hts':hts,'country':country,'customsValue':value})
              data = request('/api/trade-rules?' + q)
              print('\nCASE', hts, country)
              print(json.dumps(data, indent=2)[:16000])
              return data

          def programs(data, name):
              return [m for m in data.get('measures',[]) if str(m.get('program','')).lower() == name.lower()]

          # Broad classifications must not get a definitive Chapter 99 answer.
          broad = lookup('7321','RU')
          assert broad.get('needsFullHts') is True, broad
          assert broad.get('status') == 'needs-full-hts', broad

          # Known China Section 301 automobile case: never return a clean no-301.
          china_auto = lookup('8703230100','CN')
          assert china_auto.get('chapter99SourceAvailable') is True, china_auto
          assert programs(china_auto,'Section 301') or china_auto.get('status') == 'review-required', china_auto

          # Same automobile HTS from India must not inherit a China-only Section 301 action.
          india_auto = lookup('8703230100','IN')
          assert not programs(india_auto,'Section 301'), india_auto

          # Known Section 232 derivative-steel family from Russia: never return a clean no-232.
          russia_7321 = lookup('7321111000','RU')
          assert russia_7321.get('chapter99SourceAvailable') is True, russia_7321
          assert programs(russia_7321,'Section 232') or russia_7321.get('status') == 'review-required', russia_7321

          # The resolver must report the current HTS revision source, not a hardcoded calculator version.
          for case in (china_auto, india_auto, russia_7321):
              current = case.get('currentHts') or {}
              assert current.get('label'), case

          print('\nAll regulatory smoke tests passed.')
          PY
