name: Apply PGA screening restoration

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - .github/workflows/apply-pga-screening-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-import-calculator
          fetch-depth: 0
      - name: Patch screening layer
        run: python scripts/patch-pga-screening-v2.py
      - name: Bump screening loader cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/fx-ticker.js')
          s=p.read_text()
          s=s.replace('js/hts-import-screening-v2.js?v=20260907-5','js/hts-import-screening-v2.js?v=20260907-6')
          p.write_text(s)
          PY
      - name: Static regression checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('js/hts-import-screening-v2.js').read_text()
          required=[
            'Partner Government Agency / import requirements',
            'EPA motor-vehicle emissions',
            'NHTSA / DOT motor-vehicle safety',
            'FDA food / regulated-product screening',
            'USDA / APHIS plant and agricultural requirements',
            'EPA / TSCA chemical screening',
            'FCC radiofrequency / communications equipment',
            'Lacey Act / plant-product screening',
            'ATF firearms / ammunition requirements',
            'TTB alcohol requirements',
            'renderPgaPanel(baseData)'
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          print('PGA screening static regression passed.')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/hts-import-screening-v2.js js/fx-ticker.js
          git commit -m 'Restore PGA import requirement screening'
          git push origin HEAD:preview-import-calculator
