name: Apply Chapter 99 rate-source parser fix

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - .github/workflows/apply-ch99-rate-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-import-calculator
          fetch-depth: 0
      - name: Apply rate-source fix
        run: python scripts/patch-ch99-rate-source.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/trade-rules.mts
          git commit -m 'Use operative Chapter 99 row for rate treatment'
          git push origin HEAD:preview-import-calculator
