name: Apply vehicle-parts applicability gate

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - .github/workflows/hts-source-inspect.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-import-calculator
          fetch-depth: 0
      - run: python scripts/patch-vehicle-parts-gate.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/trade-rules.mts
          git commit -m 'Exclude automobile-parts rules from finished vehicles'
          git push origin HEAD:preview-import-calculator
