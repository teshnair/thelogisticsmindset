name: Apply global HTS estimate and unit patch

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - .github/workflows/hts-source-inspect.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-import-calculator
          fetch-depth: 0

      - name: Apply calculator patch
        run: python scripts/patch-global-screening-units.py

      - name: Validate browser JavaScript
        run: node --check js/hts-import-screening-v2.js

      - name: Validate expected changes
        run: |
          grep -q 'units: item.units' netlify/functions/hts-duty.mts
          grep -q 'id="htsUnitHint"' hts-duty-calculator.html
          grep -q 'global-worst-case-v3' js/hts-import-screening-v2.js
          grep -q 'otherLiveMeasures' js/hts-import-screening-v2.js

      - name: Commit calculator changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/hts-duty.mts hts-duty-calculator.html js/hts-import-screening-v2.js js/fx-ticker.js
          git commit -m 'Apply global tariff estimates and show HTS units'
          git push origin HEAD:preview-import-calculator
