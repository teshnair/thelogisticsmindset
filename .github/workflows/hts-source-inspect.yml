name: Apply worst-case preview patch

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - .github/workflows/hts-source-inspect.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-import-calculator
          fetch-depth: 0
      - name: Patch calculator
        run: python scripts/patch-worstcase-preview.py
      - name: Check browser script
        run: node --check js/hts-import-screening-v2.js
      - name: Commit calculator changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/trade-rules.mts js/hts-import-screening-v2.js js/fx-ticker.js
          git commit -m 'Use worst-case estimates when tariff facts are missing'
          git push origin HEAD:preview-import-calculator
      - name: Verify deployed China and India cases
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          base = 'https://deploy-preview-43--thelogisticsmindset.netlify.app'
          def get(country):
              q = urllib.parse.urlencode({'hts':'7321113050','country':country,'customsValue':'100000','_verify':time.time_ns()})
              req = urllib.request.Request(base + '/api/trade-rules?' + q, headers={'Cache-Control':'no-cache','User-Agent':'TLM-WorstCase-Verify/2.0'})
              with urllib.request.urlopen(req, timeout=35) as res:
                  return json.loads(res.read().decode())
          last = None
          for _ in range(36):
              try:
                  cn, ind = get('CN'), get('IN')
                  last = {'CN':cn,'IN':ind}
                  cn301 = [m for m in cn.get('measures',[]) if m.get('program') == 'Section 301' and m.get('ratePercent') == 25]
                  cn_ok = any((m.get('estimatedDuty') == 25000 or m.get('worstCaseEstimatedDuty') == 25000) for m in cn301)
                  in232 = next((m for m in ind.get('measures',[]) if m.get('hts') == '9903.82.09'), None)
                  in_ok = bool(in232 and in232.get('ratePercent') == 25 and (in232.get('estimatedDuty') == 25000 or in232.get('worstCaseEstimatedDuty') == 25000))
                  if cn.get('revisionVerified') is True and cn_ok and bool(cn.get('assumptions')) and in_ok:
                      print('CHINA_301_WORST_CASE_OK')
                      print('INDIA_232_REGRESSION_OK')
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  last = {'error':repr(exc)}
              time.sleep(10)
          print(json.dumps(last, indent=2)[:16000] if isinstance(last,dict) else str(last))
          raise SystemExit('Preview did not return corrected China/India results')
          PY
