name: Inspect current Chapter 99 source

on:
  push:
    branches:
      - preview-import-calculator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and inspect official current Chapter 99
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --max-time 90 \
            'https://hts.usitc.gov/reststop/file?release=currentRelease&filename=Chapter%2099' \
            -o /tmp/ch99.pdf
          file /tmp/ch99.pdf
          ls -lh /tmp/ch99.pdf
          pdftotext -layout /tmp/ch99.pdf /tmp/ch99.txt
          echo '--- 8703.23.01 contexts ---'
          grep -n -B 25 -A 12 '8703\.23\.01' /tmp/ch99.txt | head -n 220 || true
          echo '--- 7321.11.10 contexts ---'
          grep -n -B 30 -A 15 '7321\.11\.10' /tmp/ch99.txt | head -n 260 || true
          echo '--- 9903.88.01 contexts ---'
          grep -n -B 8 -A 25 '9903\.88\.01' /tmp/ch99.txt | head -n 180 || true
          echo '--- 9903.82.16 contexts ---'
          grep -n -B 12 -A 35 '9903\.82\.16' /tmp/ch99.txt | head -n 220 || true
          echo '--- current HTS revision ---'
          curl -fsSL --retry 3 --max-time 30 \
            'https://www.usitc.gov/harmonized_tariff_information/hts/archive/list' \
            | grep -Eo '2026 HTS Revision[^<]{0,80}' | head -n 5 || true
