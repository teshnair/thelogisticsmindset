name: Refresh Chapter 99 legal index on draft branch
# Owner-initiated preview only. This DOES NOT certify rates or authorize production.
on:
  push:
    branches:
      - fix/ch99-rev22-country-screen-20261030
    paths:
      - .github/workflows/refresh-ch99-index-preview.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Install official Chapter 99 PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Download CURRENT HTS Chapter 99 and generate scoped legal index
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 120 'https://hts.usitc.gov/reststop/file?release=currentRelease&filename=Chapter%2099' -o /tmp/hts-chapter99.pdf
          pdfinfo /tmp/hts-chapter99.pdf | head -20
          pdftotext -layout -enc UTF-8 /tmp/hts-chapter99.pdf /tmp/hts-chapter99.txt
          python3 scripts/build-chapter99-index.py /tmp/hts-chapter99.txt data/chapter99-index.json
      - name: Fail if generated revision or mapping cannot be corroborated
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,re
          with urllib.request.urlopen('https://hts.usitc.gov/reststop/currentRelease',timeout=30) as r:
              source=json.load(r)
          index=json.load(open('data/chapter99-index.json',encoding='utf8'))
          expected=int(re.search(r'Rev(?:ision)?\s*(\d+)',source['name']+' '+source['description'],re.I).group(1))
          assert index['htsRevision']==expected,(index['htsRevision'],expected)
          assert index['stats']['validatedCandidateLinks']>500,'Too few validated note links'
          assert index['stats']['codesWithCandidates']>500,'Generated product mapping unexpectedly small'
          assert len(index['headings'])>100,'Chapter 99 operative heading index unexpectedly small'
          print('INDEX BUILT for official revision',expected,'statistics',index['stats'])
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run regression checks (without claiming legal approval)
        run: |
          node scripts/test-ch99-origin.mjs
          node scripts/test-ch99-stale.mjs
          node scripts/test-ch99-basis.mjs
          node scripts/test-hts-shipment.mjs
          node scripts/test-regulatory-release.mjs
      - name: Commit regenerated index to DRAFT branch only
        shell: bash
        run: |
          set -euo pipefail
          git add data/chapter99-index.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update Chapter 99 legal index from current official USITC PDF (unreviewed)'
            git push origin HEAD:${{ github.ref_name }}
          fi
