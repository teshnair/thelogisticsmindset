name: Apply Chapter 99 note 16 exception gates

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - .github/workflows/fix-ch99-value-basis.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-import-calculator
          fetch-depth: 0

      - name: Patch note 16(j) and 16(k) applicability
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('netlify/functions/trade-rules.mts')
          text = p.read_text()
          old = '''if(noteTarget(meta,"16:e")){let q=boolValue(fact(input,"usMetalContentQualification"));'''
          new = '''if(noteTarget(meta,"16:j")){if(!["CA","MX"].includes(country))return{state:"not-applicable" as const,reason:"U.S. note 16(j) is limited to qualifying Canada/Mexico USMCA derivative steel articles.",requiredFacts:[]};const fta=boolValue(fact(input,"ftaQualification"));if(fta===false)return{state:"not-applicable" as const,reason:"U.S. note 16(j) requires USMCA eligibility.",requiredFacts:[]};if(fta===null)required.add("ftaQualification");}if(noteTarget(meta,"16:k")){if(![84,85,87].includes(chapter))return{state:"not-applicable" as const,reason:"U.S. note 16(k) is limited to qualifying parts in chapters 84, 85, or 87.",requiredFacts:[]};}if(noteTarget(meta,"16:e")){let q=boolValue(fact(input,"usMetalContentQualification"));'''
          if old not in text:
              raise SystemExit('note 16(e) insertion point not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Commit targeted fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/trade-rules.mts
          git commit -m 'Gate Chapter 99 note 16 exceptions correctly'
          git push origin HEAD:preview-import-calculator
