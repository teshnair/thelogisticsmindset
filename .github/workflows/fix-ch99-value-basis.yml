name: Capture India Section 232 debug response

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - .github/workflows/fix-ch99-value-basis.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-import-calculator
          fetch-depth: 0

      - name: Capture deployed API response
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          base = 'https://deploy-preview-43--thelogisticsmindset.netlify.app'
          data = None
          last = None
          for attempt in range(12):
              try:
                  params = urllib.parse.urlencode({
                      'hts':'7321113050',
                      'country':'IN',
                      'customsValue':'100000',
                      '_debug':time.time_ns(),
                  })
                  req = urllib.request.Request(base + '/api/trade-rules?' + params, headers={'Cache-Control':'no-cache','User-Agent':'TLM-Debug/1.0'})
                  with urllib.request.urlopen(req, timeout=35) as res:
                      candidate = json.loads(res.read().decode('utf-8'))
                  if candidate.get('revisionVerified') is True:
                      data = candidate
                      break
                  last = candidate
              except Exception as exc:
                  last = {'error': repr(exc)}
              time.sleep(8)
          if data is None:
              data = last or {'error':'no response'}
          with open('tmp-india-232-debug.json','w') as f:
              json.dump(data,f,indent=2)
          PY

      - name: Commit debug response
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-india-232-debug.json
          git commit -m 'Capture India Section 232 debug response'
          git push origin HEAD:preview-import-calculator
