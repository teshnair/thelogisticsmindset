name: Verify corrected India Section 232 result

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - .github/workflows/fix-ch99-value-basis.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify deployed India Section 232 calculation
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request

          base = 'https://deploy-preview-43--thelogisticsmindset.netlify.app'
          last = None
          for attempt in range(30):
              try:
                  params = urllib.parse.urlencode({
                      'hts':'7321113050',
                      'country':'IN',
                      'customsValue':'100000',
                      '_verify':time.time_ns(),
                  })
                  req = urllib.request.Request(base + '/api/trade-rules?' + params, headers={'Cache-Control':'no-cache','User-Agent':'TLM-Preview-Verify/3.0'})
                  with urllib.request.urlopen(req, timeout=35) as res:
                      data = json.loads(res.read().decode('utf-8'))
                  last = data
                  measures = data.get('measures', [])
                  residual = next((m for m in measures if m.get('hts') == '9903.82.09'), None)
                  blockers = [m for m in measures if m.get('hts') in ('9903.82.06','9903.82.20','9903.82.21','9903.82.23','9903.82.24','9903.82.25','9903.82.26')]
                  if (data.get('revisionVerified') is True and
                      residual and residual.get('applicability') == 'applicable' and
                      residual.get('ratePercent') == 25 and
                      residual.get('estimatedDuty') == 25000 and
                      not blockers and
                      not data.get('requiredFacts')):
                      print(json.dumps(data, indent=2)[:12000])
                      print('INDIA_232_PREVIEW_OK')
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  last = {'error':repr(exc)}
              time.sleep(10)
          print(json.dumps(last, indent=2)[:12000] if isinstance(last,dict) else str(last))
          raise SystemExit('Corrected India Section 232 result did not appear in preview')
          PY
