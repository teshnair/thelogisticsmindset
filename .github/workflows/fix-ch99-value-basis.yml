name: Verify India Section 232 preview

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - .github/workflows/fix-ch99-value-basis.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Netlify preview and verify India calculation
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request

          base = 'https://deploy-preview-43--thelogisticsmindset.netlify.app'
          expected = None
          last = None
          for attempt in range(18):
              try:
                  params = urllib.parse.urlencode({
                      'hts':'7321113050',
                      'country':'IN',
                      'customsValue':'100000',
                      '_verify':time.time_ns(),
                  })
                  req = urllib.request.Request(base + '/api/trade-rules?' + params, headers={'Cache-Control':'no-cache','User-Agent':'TLM-Preview-Verify/1.0'})
                  with urllib.request.urlopen(req, timeout=35) as res:
                      data = json.loads(res.read().decode('utf-8'))
                  print(json.dumps(data, indent=2)[:20000])
                  measures = data.get('measures', [])
                  residual = next((m for m in measures if m.get('hts') == '9903.82.09'), None)
                  reduced = next((m for m in measures if m.get('hts') == '9903.82.06'), None)
                  if (data.get('revisionVerified') is True and residual and
                      residual.get('applicability') == 'applicable' and
                      residual.get('ratePercent') == 25 and
                      residual.get('estimatedDuty') == 25000 and
                      reduced is None and
                      'metalContentValue' not in data.get('requiredFacts', [])):
                      expected = data
                      break
                  last = data
              except Exception as exc:
                  last = repr(exc)
              time.sleep(10)

          if expected is None:
              raise SystemExit('Preview did not return the corrected India Section 232 result: ' + str(last)[:3000])
          print('INDIA_232_PREVIEW_OK')
          PY
