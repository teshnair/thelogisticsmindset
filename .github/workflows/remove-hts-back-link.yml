name: Remove HTS Back Link

on:
  push:
    branches:
      - feature/remove-hts-back-link
    paths:
      - "scripts/remove-hts-back-link.mjs"
      - ".github/workflows/remove-hts-back-link.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Remove calculator back link
        run: node scripts/remove-hts-back-link.mjs
      - name: Remove one-time files and commit
        run: |
          rm -f scripts/remove-hts-back-link.mjs .github/workflows/remove-hts-back-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Remove HTS calculator back link"
          git push
