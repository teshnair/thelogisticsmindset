name: Apply HTS unit UI patch

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - scripts/patch-hts-unit-ui.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-import-calculator
          fetch-depth: 0
      - name: Apply HTS unit UI patch
        run: python scripts/patch-hts-unit-ui.py
      - name: Commit calculator changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hts-duty-calculator.html netlify/functions/hts-duty.mts
          git commit -m 'Normalize HTS units and populate quantity selector'
          git push origin HEAD:preview-import-calculator
