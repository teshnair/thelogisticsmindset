name: Apply mutually exclusive Section 232 estimate fix

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - .github/workflows/apply-metal-mutual-exclusive-estimate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-import-calculator
          fetch-depth: 0
      - name: Apply mutual-exclusivity estimate fix
        run: python scripts/patch-metal-mutual-exclusive-estimate.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/trade-rules.mts
          git commit -m 'Apply only one mutually exclusive Section 232 estimate'
          git push origin HEAD:preview-import-calculator
