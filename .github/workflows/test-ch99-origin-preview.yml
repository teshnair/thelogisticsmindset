name: Chapter 99 origin regression checks
on:
  push:
    branches: [fix/ch99-origin-dispatch-20261028]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  origin:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify origin-specific Chapter 99 regression
        run: node scripts/test-ch99-origin.mjs
      - name: Verify Chapter 99 status basis
        run: node scripts/test-ch99-basis.mjs
      - name: Verify complete tariff calculator and publishing checkpoint
        run: |
          node scripts/verify-regulatory-release-gate.mjs
          node scripts/test-regulatory-release.mjs
          node scripts/test-hts-shipment.mjs
          node scripts/test-tariff-engine.mjs
          node scripts/test-hts-8431.mjs
          node scripts/test-hts-guidance.mjs
          node scripts/test-hts-worst-case.mjs
      - name: Verify HTML output and print rules
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const js=fs.readFileSync('js/hts-shipment.js','utf8');
          const css=fs.readFileSync('css/hts-shipment.css','utf8');
          assert.match(js,/function renderAgencyReview\\(r\\)/);
          assert.match(js,/Potential government agency requirements/);
          assert.ok(js.includes('Antidumping / countervailing duty'));
          assert.match(js,/Chapter 99 replacement provision/);
          assert.match(css,/@page\\{size:auto;margin:13mm\\}/);
          assert.match(css,/grid-template-columns:repeat\\(2,minmax\\(0,1fr\\)\\)!important/);
          console.log('HTML/PDF print rule assertions passed');
          JS
