name: Fix monthly Stripe links

on:
  push:
    branches:
      - feature/fix-monthly-stripe-links

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fix-monthly-stripe-links
      - name: Update monthly support links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/support.js')
          s = p.read_text()
          s = s.replace('const STRIPE_MONTHLY_URL = "https://buy.stripe.com/14A9AU2yp1ZabLEcgD1kA01";', 'const STRIPE_MONTHLY_5_URL = "https://buy.stripe.com/14A9AU2yp1ZabLEcgD1kA01";\n  const STRIPE_MONTHLY_3_URL = "https://buy.stripe.com/bJe4gA7SJ9rCaHA5Sf1kA02";', 1)
          s = s.replace('<a class="support-monthly-button" href="${STRIPE_MONTHLY_URL}" target="_blank" rel="noopener noreferrer">$3 / month</a>', '<a class="support-monthly-button" href="${STRIPE_MONTHLY_3_URL}" target="_blank" rel="noopener noreferrer">$3 / month</a>', 1)
          s = s.replace('<a class="support-monthly-button" href="${STRIPE_MONTHLY_URL}" target="_blank" rel="noopener noreferrer">$5 / month</a>', '<a class="support-monthly-button" href="${STRIPE_MONTHLY_5_URL}" target="_blank" rel="noopener noreferrer">$5 / month</a>', 1)
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/support.js
          git commit -m "Use separate monthly Stripe links"
          git push origin HEAD:feature/fix-monthly-stripe-links
