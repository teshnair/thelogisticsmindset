name: Apply Chapter 99 note-boundary patch

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - .github/workflows/apply-chapter99-note-boundary.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-import-calculator
          fetch-depth: 0
      - name: Patch parser
        run: python scripts/patch-chapter99-note-boundary.py
      - name: Commit parser fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build-chapter99-index.py
          git commit -m 'Fix Chapter 99 bare note boundaries'
          git push origin HEAD:preview-import-calculator
