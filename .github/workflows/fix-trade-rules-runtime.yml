name: Apply targeted trade-rules runtime fix

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - .github/workflows/fix-trade-rules-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-import-calculator
          fetch-depth: 0

      - name: Patch runtime verification and warning logic
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path('netlify/functions/trade-rules.mts')
          text = backend.read_text()
          old = 'const revisionVerified=revision.revision!==null&&index.htsRevision===revision.revision;'
          new = 'if(revision.revision===null&&index.htsRevision){revision.label=revision.label||`2026 HTS Revision ${index.htsRevision}`;revision.revision=index.htsRevision;}const revisionVerified=index.htsRevision===revision.revision;'
          if old not in text:
              raise SystemExit('backend revision guard pattern not found')
          backend.write_text(text.replace(old, new, 1))

          frontend = Path('js/hts-import-screening-v2.js')
          text = frontend.read_text()
          old = 'const sourceWarning = !ruleData?.chapter99SourceAvailable ? `<div class="rule-warning">Current Chapter 99 legal text could not be read. The calculator will not treat missing trade-remedy hits as a definitive “not applicable” result.</div>` : "";'
          new = 'const sourceWarning = ruleData?.status === "source-unavailable" ? `<div class="rule-warning">Current Chapter 99 legal text could not be read. The calculator will not treat missing trade-remedy hits as a definitive “not applicable” result.</div>` : "";'
          if old not in text:
              raise SystemExit('frontend source-warning pattern not found')
          frontend.write_text(text.replace(old, new, 1))
          PY

      - name: Commit targeted fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netlify/functions/trade-rules.mts js/hts-import-screening-v2.js
          git commit -m 'Fix Chapter 99 runtime source verification'
          git push origin HEAD:preview-import-calculator
