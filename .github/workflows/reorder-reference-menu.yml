name: Reorder References menu

on:
  push:
    branches:
      - feature/reference-menu-expansion

permissions:
  contents: write

jobs:
  reorder:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reference-menu-expansion
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/reorder-reference-menu.mjs
      - name: Commit rewritten pages and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/reorder-reference-menu.mjs .github/workflows/reorder-reference-menu.yml
          git add '*.html'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Put U.S. HTS Duty Calculator first in References menu"
          git push
