name: Apply support site UI v2

on:
  push:
    branches:
      - feature/support-site-v2
    paths:
      - .github/workflows/apply-support-site-v2.yml

permissions:
  contents: write

jobs:
  apply-support-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/support-site-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QR dependency
        run: python -m pip install 'qrcode[pil]'

      - name: Generate support UI and update pages
        run: python scripts/apply-support-site-safe.py

      - name: Commit generated support UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' css/support.css js/support.js img/support
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add site support panel"
          git push origin HEAD:feature/support-site-v2
