name: Apply calculator feedback patch

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - scripts/patch-user-feedback-round.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-import-calculator
          fetch-depth: 0
      - name: Apply calculator feedback patch
        run: python scripts/patch-user-feedback-round.py
      - name: Commit patched calculator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hts-duty-calculator.html js/hts-import-screening-v2.js netlify/functions/hts-duty.mts netlify/functions/trade-rules.mts .github/workflows/hts-calculator-smoke.yml
          git commit -m 'Fix HTS units, import purpose and metal tariff exclusivity'
          git push origin HEAD:preview-import-calculator
