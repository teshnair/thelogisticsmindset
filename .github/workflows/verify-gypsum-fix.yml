name: Verify gypsum Chapter 99 mapping

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - .github/workflows/verify-gypsum-fix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify deployed gypsum case
        env:
          BASE_URL: https://deploy-preview-43--thelogisticsmindset.netlify.app
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          base=os.environ['BASE_URL']

          def get_trade():
              last=None
              for i in range(12):
                  q=urllib.parse.urlencode({'hts':'6809110010','country':'KZ','customsValue':'100000','_verify':time.time_ns()})
                  try:
                      req=urllib.request.Request(base+'/api/trade-rules?'+q,headers={'Cache-Control':'no-cache','User-Agent':'TLM-Gypsum-Verify/2.0'})
                      with urllib.request.urlopen(req,timeout=40) as r:
                          data=json.loads(r.read().decode())
                      refs={m.get('hts') for m in data.get('measures',[])}
                      if not ({'9903.74.01','9903.76.01'} & refs):
                          return data
                      last=AssertionError(('stale/false refs',sorted(refs)))
                  except Exception as e: last=e
                  time.sleep(6)
              raise last or RuntimeError('trade-rules verification failed')

          trade=get_trade()
          refs={m.get('hts') for m in trade.get('measures',[])}
          assert '9903.74.01' not in refs, trade
          assert '9903.76.01' not in refs, trade
          print('Gypsum Chapter 99 refs:',sorted(x for x in refs if x))

          payload=json.dumps({'action':'calculate','hts':'6809110010','country':'KZ','customsValue':100000,'mode':'ocean'}).encode()
          req=urllib.request.Request(base+'/api/hts-duty',data=payload,method='POST',headers={'Content-Type':'application/json','Cache-Control':'no-cache','User-Agent':'TLM-Gypsum-Verify/2.0'})
          with urllib.request.urlopen(req,timeout=40) as r:
              duty=json.loads(r.read().decode())
          units=duty.get('classification',{}).get('units',[])
          assert all('<' not in str(u) and 'sup' not in str(u).lower() for u in units), units
          assert 'kg' in units and 'm²' in units, units
          print('Gypsum units:',units)
          print('Exact gypsum deployment verification passed.')
          PY
