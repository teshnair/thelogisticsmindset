name: Apply mutually exclusive Section 232 card labels

on:
  push:
    branches:
      - preview-import-calculator
    paths:
      - .github/workflows/apply-metal-exclusive-card-labels.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-import-calculator
          fetch-depth: 0
      - name: Apply result-card labels
        run: python scripts/patch-metal-exclusive-card-labels.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/hts-import-screening-v2.js
          git commit -m 'Label mutually exclusive Section 232 alternatives'
          git push origin HEAD:preview-import-calculator
