name: Diagnose live Chapter 99 note mapping
on:
  push:
    branches: [fix/ch99-rev22-country-screen-20261030]
    paths: [.github/workflows/diagnose-ch99-index.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print candidate/legal-note alignment
        run: |
          python3 - <<'PY'
          import json,re
          i=json.load(open('data/chapter99-index.json'))
          print('REV',i['htsRevision'])
          for code in ('87169050','8716905060','83024130','8302413000','73269086','720610','39191020'):
              refs=i['codes'].get(code,[])
              print('CODE',code,'LINKS',refs)
              for ref in refs:
                  if not ref.startswith(('9903.91.','9903.82.')): continue
                  h=i['headings'].get(ref,{})
                  print('REF',ref,'TARGETS',h.get('noteTargets'))
                  for target,body in (h.get('legalContext') or {}).items():
                      if target.startswith(('31:','16:')):
                          m=re.search('8716.{0,30}',body)
                          print(' NOTE',target,'LEN',len(body),'HAS 8716',bool(m),'LOC',m.group(0) if m else '-','START',body[:180])
          PY
